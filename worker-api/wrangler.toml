# 智策远控 API Worker —— 登录 + 地址簿云同步
# 契约文档：rustdesk-selfhost/docs/13-login-api-design.md
# D1 复用账户现有空库 intern-db（3266d0d7-fda9-4030-b71b-2c7b2b791ec7，无表，
# 已在其中创建本服务 4 张表——非破坏性复用，避免账户 10 库上限删库）

name = "zcdesk-api"
main = "src/index.js"
compatibility_date = "2025-11-01"
workers_dev = false

# 自定义域：zcdeskapi.jiuyeke.cn（部署后经 REST API 或 Dashboard 绑定）
routes = [{ pattern = "zcdeskapi.jiuyeke.cn", custom_domain = true }]

# D1 数据库绑定（Worker 代码中通过 env.DB 访问）
[[d1_databases]]
binding = "DB"
database_name = "intern-db"
database_id = "3266d0d7-fda9-4030-b71b-2c7b2b791ec7"

# 自定义域绑定（二选一）：
# 1) 推荐：在 Cloudflare Dashboard -> Workers & Pages -> zcdesk-api -> Settings ->
#    Domains & Routes -> Add Custom Domain，填 zcdeskapi.jiuyeke.cn（详见 README.md）；
# 2) 或取消下行注释用 wrangler 直接绑定：
# routes = [{ pattern = "zcdeskapi.jiuyeke.cn", custom_domain = true }]
