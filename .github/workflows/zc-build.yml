name: ZC Custom Build

on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: "Release tag for artifacts"
        required: false
        default: "zc"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag }}
